# ── Search URLs the scraper fetches ───────────────────────────────────────
# Your combined page lists all property types together, so there's just one URL.
# Set its maxRent to your HIGHEST cap (1350) so studios aren't dropped by the
# server; matcher.py then trims rooms down to their 800 cap client-side.
# Build the URL in the browser (city, min size, max rent) and paste it here.
search_urls:
  - "https://kamernet.nl/en/for-rent/properties-amsterdam?radius=1&sort=1"

# ── Your search preferences (client-side refinement of the results) ───────────
# Anything left blank / commented is ignored (no filtering on that field).

search:
  # The city or cities you're searching. Case-insensitive substring match.
  cities:
    - Amsterdam
  # Per-type max monthly rent in EUR (inclusive). The cap that applies is
  # chosen by the listing's property type. Keys are matched case-insensitively.
  max_rent_by_type:
    Studio: 1500
    Room: 1050
    Apartment: 1500
  # Fallback cap for any type not listed above. Leave null for no cap.
  max_rent: null
  # Min living area in m². Leave null for no minimum.
  min_area: 1
  # Allowed property types. Kamernet uses: Room, Studio, Apartment, "Anti-squat".
  # Leave the list empty to allow all.
  property_types:
    - Room
    - Studio
  # Only alert on listings that allow your situation. Optional keyword filters.
  # A listing is REJECTED if its description contains any of these (lowercased).
  exclude_keywords:
    # remove if this doesn't apply to you
  # A listing is only kept if its description contains at least one of these.
  # Leave empty to skip this check.
  require_keywords: []

# ── The message you'd send (used for the pre-filled one-tap reply) ────────────
message:
  template: |
    Dear Sir/Madam,

      I am writing to express my interest in this listing "{title}" in {city}.

      My name is Andrei, I am 23 years old, and I am currently studying Masters Software Engineering at University of Amsterdam. I can provide proof of enrolment if necessary.

      I believe I would be a suitable candidate because, alongside my studies, I will be doing a paid internship at ING. This gives me a steady income in addition to my student finance, meaning I can comfortably afford the rent. If needed, one of my family members is happy to act as guarantor.

      I am a tidy and reliable tenant, available at short notice and flexible regarding the start date.

      I would be glad to hear what the next steps are. I am easy to reach for any questions or to arrange a viewing.

      Thank you for your time. I hope to have the opportunity to live here soon.

      Kind regards,

      Simionov Andrei
      +31 6 35 62 97 02
      simionov.andrei@gmail.com

# ── How often to poll (seconds). Only used when running as an always-on loop. ──
poll_interval_seconds: 5
